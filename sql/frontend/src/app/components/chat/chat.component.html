<div class="chat-container">
  <div class="chat-header">
    <div class="header-title">
      <h2>Ask Chloe</h2>
      <p>Query your cemetery data in plain English</p>
    </div>
    <div class="header-actions">
      <button
        class="action-button"
        (click)="toggleExamples()"
        [title]="showExamples ? 'Hide examples' : 'Show examples'"
      >
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path
            d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14c.015-.34.208-.646.477-.859a4 4 0 10-4.954 0c.27.213.462.519.476.859h4.002z"
          />
        </svg>
      </button>
      <button class="action-button" (click)="clearChat()" title="Clear chat">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path
            fill-rule="evenodd"
            d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Examples Panel -->
  <div *ngIf="showExamples && examples.length > 0" class="examples-panel">
    <h3>Example Queries</h3>
    <div class="examples-grid">
      <div *ngFor="let category of examples" class="example-category">
        <h4>{{ category.category }}</h4>
        <div class="example-queries">
          <button
            *ngFor="let query of category.queries"
            class="example-query"
            (click)="useExample(query)"
          >
            {{ query }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages-container" #messagesContainer>
    <app-message
      *ngFor="let message of messages"
      [message]="message"
      (suggestionClicked)="onSuggestionClick($event)"
      (loadMore)="onLoadMore($event)"
    ></app-message>

    <!-- Loading indicator -->
    <div *ngIf="isLoading" class="loading-indicator">
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <p>Processing your query...</p>
    </div>
  </div>

  <!-- Input -->
  <div class="input-container">
    <textarea
      [(ngModel)]="currentQuestion"
      (keydown.enter)="onEnterKey($any($event))"
      placeholder="Ask me anything about your cemetery data..."
      rows="2"
      [disabled]="isLoading"
    ></textarea>
    <button
      class="send-button"
      (click)="sendMessage()"
      [disabled]="!currentQuestion.trim() || isLoading"
      title="Send message"
    >
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path
          d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"
        />
      </svg>
    </button>
  </div>
</div>
