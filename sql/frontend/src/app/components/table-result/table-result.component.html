<div class="table-container">
  <div *ngIf="data.rowCount === 0" class="empty-state">
    <p>No results found</p>
  </div>

  <div *ngIf="data.rowCount > 0">
    <!-- Export Buttons -->
    <div class="export-actions">
      <button
        class="export-button export-pdf"
        (click)="exportAsPDF()"
        title="Export as PDF"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          ></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        Export PDF
      </button>
      <button
        class="export-button export-excel"
        (click)="exportAsExcel()"
        title="Export as Excel"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          ></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <rect x="8" y="12" width="8" height="6"></rect>
          <line x1="8" y1="15" x2="16" y2="15"></line>
          <line x1="12" y1="12" x2="12" y2="18"></line>
        </svg>
        Export Excel
      </button>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table class="results-table">
        <thead>
          <tr>
            <th *ngFor="let column of data.columns">
              {{ formatColumnName(column) }}
            </th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let row of data.rows; let i = index"
            [class.even]="i % 2 === 0"
          >
            <td
              *ngFor="let column of data.columns"
              [class.html-content]="isHtmlContent(row[column])"
            >
              <span *ngIf="!isHtmlContent(row[column])">{{
                formatValue(row[column])
              }}</span>
              <span *ngIf="isHtmlContent(row[column])" class="html-stripped">{{
                stripHtml(row[column])
              }}</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="table-footer">
      <div class="footer-info">
        <span *ngIf="data.totalCount">
          Showing {{ (data.offset || 0) + 1 }} -
          {{ (data.offset || 0) + data.rowCount }} of {{ data.totalCount }} rows
        </span>
        <span *ngIf="!data.totalCount">
          {{ data.rowCount }} {{ data.rowCount === 1 ? "row" : "rows" }}
        </span>
      </div>
      <button
        *ngIf="data.hasMore"
        class="load-more-button"
        (click)="onLoadMore()"
      >
        Load More
      </button>
    </div>
  </div>
</div>
